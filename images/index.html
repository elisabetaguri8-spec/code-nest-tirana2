<!DOCTYPE html>
<!-- class="dark" is the fallback for visitors without JavaScript;
     the script below swaps it for "light" when the phone/system
     (or the saved preference) asks for the light theme -->
<html lang="sq" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#050b1a" id="stubThemeColor">
<!-- "dark light" so Android WebView honours prefers-color-scheme instead of
     inverting the page. Keep in sync with :root{color-scheme} below. -->
<meta name="color-scheme" content="dark light">
<title>Code Nest Tirana</title>
<link rel="canonical" href="https://elisabetaguri8-spec.github.io/code-nest-tirana2/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- The site now lives at the root of the domain. This page only exists so
     old links (/images/) keep working - it forwards to the real site.

     !!  DO NOT UPLOAD THIS FILE TO THE SITE ROOT  !!
     This is a REDIRECT STUB. If it is ever placed at /index.html the whole
     homepage breaks, because it would redirect to "../" - a folder above
     the site. Upload files from your computer with git, never with the
     "Add files via upload" button on github.com. -->
<script>
/* Redirect ONLY when this page really lives in /images/.
   If the file is ever uploaded to the site root by accident it must NOT
   redirect to itself - that would break the whole site.
   The meta refresh is written by this script instead of being hard-coded,
   so it physically cannot fire in the wrong place. */
(function(){
  if(/\/images\//i.test(location.pathname)){
    document.write('<meta http-equiv="refresh" content="0; url=../">');
    location.replace("../");
  }
})();
</script>
<script>
/* Pick the theme BEFORE the first paint - the same rule as the main site:
   follow the phone/system theme, unless the visitor saved a choice.
   "only" in color-scheme (see the stylesheet) forbids the browser from
   force-darkening / inverting the page. */
(function(){
  var root=document.documentElement, meta=document.getElementById("stubThemeColor"), saved=null;
  try{ saved=localStorage.getItem("cnt-theme"); }catch(e){}
  if(saved===null||saved===undefined){
    try{
      var cm=("; "+document.cookie).match(/; ?cnt-theme=(light|dark)/);
      if(cm) saved=cm[1];
    }catch(e){}
  }
  var systemLight = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
  var light = saved ? (saved==="light") : systemLight;
  root.classList.remove("light","dark");
  root.classList.add(light ? "light" : "dark");
  root.setAttribute("data-theme", light ? "light" : "dark");
  if(meta) meta.setAttribute("content", light ? "#f3f6fc" : "#050b1a");
  /* tell the UA which scheme is really in use and forbid it to override it */
  var sm=document.querySelector('meta[name="color-scheme"]');
  if(sm) sm.setAttribute("content", light ? "only light" : "dark");
})();
</script>
<style>
  /* --- theme tokens -------------------------------------------------------
     The colours are painted by us in BOTH modes, so the UA must not be
     allowed to override them: `color-scheme: only <mode>` forbids the
     browser's forced-dark / auto-dark / invert filter.
     The first declaration in each rule is the fallback for browsers that
     do not understand the "only" keyword. */
  :root{
    color-scheme:light;
    color-scheme:only light;
    --bg:#f3f6fc;
    --box:#ffffff;
    --text:#0f1a33;
    --muted:#53607a;
    --line:rgba(15,23,42,.10);
    --sh:0 18px 50px rgba(20,40,90,.12);   /* tinted, never pure black */
  }
  html.dark{
    color-scheme:dark;
    color-scheme:only dark;
    --bg:#050b1a;
    --box:#0c1830;
    --text:#e8edf6;
    --muted:#93a0b8;
    --line:rgba(148,163,184,.14);
    --sh:0 18px 50px rgba(2,8,28,.55);
  }
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:var(--bg,#f3f6fc);color:var(--text,#0f1a33);
       font-family:Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .box{max-width:420px;background:var(--box,#fff);border:1px solid var(--line,rgba(15,23,42,.1));border-radius:20px;
       padding:38px 28px;box-shadow:var(--sh,0 18px 50px rgba(20,40,90,.12))}
  .mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;
        background:linear-gradient(145deg,#1e7bff,#0a2570);color:#fff;font-weight:800;font-size:26px;
        letter-spacing:-1px;margin-bottom:18px;box-shadow:0 10px 26px rgba(20,88,216,.35)}
  h1{margin:0 0 10px;font-size:22px;letter-spacing:-.4px}
  p{margin:0 0 22px;color:var(--muted,#53607a);font-size:15px;line-height:1.6}
  a{display:inline-block;padding:14px 28px;border-radius:14px;text-decoration:none;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#2f8bff 0%,#1458d8 100%);box-shadow:0 10px 26px rgba(20,88,216,.35)}
  small{display:block;margin-top:18px;color:var(--muted,#8a97b0);font-size:13px}
  /* High-contrast / forced-colours mode: the UA drops shadows, so the box
     must stay readable on its own. */
  @media (forced-colors: active){
    .box{background:Canvas;color:CanvasText;border:1px solid CanvasText;box-shadow:none}
    a{background:ButtonFace;color:ButtonText;border:1px solid ButtonText;box-shadow:none}
  }
</style>
</head>
<body>
  <div class="box">
    <span class="mark">CN</span>
    <h1>Code Nest Tirana</h1>
    <p>Faqja u zhvendos në adresën kryesore të faqes.</p>
    <a href="../">Hap faqen</a>
    <small>https://elisabetaguri8-spec.github.io/code-nest-tirana2/</small>
  </div>
</body>
</html>
